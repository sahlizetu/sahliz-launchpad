{% extends "base.html" %}{% load i18n %}
{% block body %}
<section class="card narrow">
  <h1>{% translate "Create a startup account" %}</h1>
  <form method="post">
    {% csrf_token %}{{ form.as_p }}
    <button type="submit">{% translate "Create account" %}</button>
  </form>
  <p><a href="{% url 'login' %}">{% translate "Sign in" %}</a></p>
</section>
{% endblock %}
