services:
  - type: web
    name: sahliz-launchpad
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn launchpad.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: FACTORY_ADDRESS
        sync: false
